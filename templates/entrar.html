<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroGuide — Entrar</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Raleway:wght@200;300&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared-ui-controls.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
    <!-- O menu.css é carregado aqui de propósito: é ele que define a moldura da
         página (.conteudo centrado, a fotografia de fundo, a vinheta). Assim a
         página de entrada tem exatamente o mesmo fundo do menu, em vez de uma
         cópia que se desalinhava à primeira alteração feita num dos lados. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<!-- A classe "page-menu" faz o body herdar a moldura do menu (foto de fundo e
     vinheta, ver menu.css); "page-auth" é o que o auth.css usa para o que é
     só desta página. -->
<body class="page-menu page-auth" data-bg-theme="menu">

    <div class="bg-foto" aria-hidden="true">
        <img src="{{ url_for('static', filename='images/618.jpg') }}" alt="">
    </div>

    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="stars" id="stars"></div>

    <a id="btn-voltar" class="glass-panel" href="/">◀ Menu</a>

    <!-- Os ícones dos campos, desenhados uma vez e reutilizados com <use>.
         O traço (cor, espessura) vem do CSS, em .auth-campo-icone. -->
    <svg class="auth-sprite" aria-hidden="true" focusable="false">
        <symbol id="ic-pessoa" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4.5 20c.6-3.6 3.6-5.5 7.5-5.5s6.9 1.9 7.5 5.5"></path>
        </symbol>
        <symbol id="ic-email" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="3"></rect>
            <path d="m4 7.5 8 5.5 8-5.5"></path>
        </symbol>
        <symbol id="ic-cadeado" viewBox="0 0 24 24">
            <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"></rect>
            <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path>
        </symbol>
    </svg>

    <div class="conteudo">
        <!-- O palco: o cartão e, por trás dele, a aura de nebulosa que o vidro
             refrata. É a aura que dá cor ao vidro — sem nada colorido por
             trás, o liquid glass lê-se como cinzento. -->
        <div class="auth-palco">
            <div class="auth-aura" aria-hidden="true"></div>

            <div class="auth-cartao glass-panel">
                <!-- O emblema: um planeta com anel dentro de uma bolha de vidro,
                     e um satélite a orbitá-la. É decoração — o nome vem já a
                     seguir em texto. -->
                <div class="auth-emblema" aria-hidden="true">
                    <span class="auth-orbita"></span>
                    <svg viewBox="0 0 64 64" focusable="false">
                        <defs>
                            <radialGradient id="ag-planeta" cx="36%" cy="30%" r="75%">
                                <stop offset="0" stop-color="#eef6ff"></stop>
                                <stop offset="0.32" stop-color="#94c4ff"></stop>
                                <stop offset="0.72" stop-color="#5b62dc"></stop>
                                <stop offset="1" stop-color="#2b2170"></stop>
                            </radialGradient>
                            <linearGradient id="ag-anel" x1="0" x2="1" y1="0" y2="0">
                                <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"></stop>
                                <stop offset="0.5" stop-color="#d6e8ff" stop-opacity="0.95"></stop>
                                <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"></stop>
                            </linearGradient>
                        </defs>
                        <g transform="rotate(-18 32 32)">
                            <!-- metade de trás do anel, por baixo do planeta -->
                            <path d="M6 32 A26 8 0 0 1 58 32" fill="none" stroke="url(#ag-anel)"
                                stroke-width="1.6" opacity="0.5"></path>
                            <circle cx="32" cy="32" r="13" fill="url(#ag-planeta)"></circle>
                            <!-- metade da frente, por cima -->
                            <path d="M6 32 A26 8 0 0 0 58 32" fill="none" stroke="url(#ag-anel)"
                                stroke-width="1.8"></path>
                        </g>
                    </svg>
                </div>

                <div class="auth-titulo">AstroGuide</div>
                <p class="auth-sub">A tua conta de observação</p>

                <!-- Abas. São botões a sério e não <div>, para serem alcançáveis
                     por teclado (Tab) e acionáveis com Enter — tal como o botão de
                     configurações, que já tinha sido convertido de div para button
                     pelo mesmo motivo. O data-ativa diz ao CSS para que lado
                     desliza a pílula de vidro (é o auth.js que o muda). -->
                <div class="auth-abas" data-ativa="entrar">
                    <button type="button" id="aba-entrar" class="auth-aba ativa"
                        onclick="mostrarAba('entrar')">Entrar</button>
                    <button type="button" id="aba-registar" class="auth-aba"
                        onclick="mostrarAba('registar')">Criar conta</button>
                </div>

                <form id="form-entrar" class="auth-form" onsubmit="submeterEntrar(event)">
                    <label for="entrar-identificador">Nome ou email</label>
                    <div class="auth-campo">
                        <svg class="auth-campo-icone" aria-hidden="true" focusable="false"><use href="#ic-pessoa"></use></svg>
                        <input type="text" id="entrar-identificador" name="identificador"
                            autocomplete="username" spellcheck="false" autofocus>
                    </div>

                    <label for="entrar-password">Password</label>
                    <div class="auth-campo">
                        <svg class="auth-campo-icone" aria-hidden="true" focusable="false"><use href="#ic-cadeado"></use></svg>
                        <input type="password" id="entrar-password" name="password"
                            autocomplete="current-password">
                    </div>

                    <button type="submit" class="auth-btn">Entrar</button>
                </form>

                <form id="form-registar" class="auth-form escondido" onsubmit="submeterRegistar(event)">
                    <label for="registar-nome">Nome de utilizador</label>
                    <div class="auth-campo">
                        <svg class="auth-campo-icone" aria-hidden="true" focusable="false"><use href="#ic-pessoa"></use></svg>
                        <input type="text" id="registar-nome" name="nome"
                            autocomplete="username" spellcheck="false">
                    </div>

                    <label for="registar-email">Email</label>
                    <div class="auth-campo">
                        <svg class="auth-campo-icone" aria-hidden="true" focusable="false"><use href="#ic-email"></use></svg>
                        <input type="email" id="registar-email" name="email"
                            autocomplete="email" spellcheck="false">
                    </div>

                    <label for="registar-password">Password</label>
                    <div class="auth-campo">
                        <svg class="auth-campo-icone" aria-hidden="true" focusable="false"><use href="#ic-cadeado"></use></svg>
                        <input type="password" id="registar-password" name="password"
                            autocomplete="new-password">
                    </div>
                    <p class="auth-dica">Pelo menos 8 caracteres.</p>

                    <button type="submit" class="auth-btn">Criar conta</button>
                </form>

                <!-- aria-live: a mensagem de erro aparece sem a página mudar, por
                     isso um leitor de ecrã só a anuncia se lhe for dito que este
                     bloco é para acompanhar. -->
                <div id="auth-erro" class="auth-erro" role="alert" aria-live="polite"></div>
            </div>
        </div>

        <p class="auth-nota">
            Sem conta também podes usar o AstroGuide. Com conta, o céu passa a ser
            calculado para o sítio onde estás e guardamos os teus favoritos.
        </p>
    </div>

    <script src="/static/js/shared-ui-controls.js"></script>
    <script src="/static/js/auth.js"></script>
</body>

</html>
